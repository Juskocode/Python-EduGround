<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Famous problem-solving pattern map</title>
  <desc id="desc">A central strategy compass connects to recognizable patterns for binary search, sliding windows and two pointers, graph traversal, dynamic programming, and greedy interval selection.</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="27" x2="900" y2="536" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF6FF"/>
      <stop offset=".35" stop-color="#F5F0FF"/>
      <stop offset=".68" stop-color="#EEF9F4"/>
      <stop offset="1" stop-color="#FFF4E8"/>
    </linearGradient>
    <radialGradient id="compass" cx="0" cy="0" r="1" gradientTransform="translate(480 280) rotate(90) scale(94)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9CBFF"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#18245D" flood-opacity=".12"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#18245D" stroke-opacity=".04"/>
    </pattern>
  </defs>

