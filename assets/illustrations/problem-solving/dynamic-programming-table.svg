      <rect x="529" y="181" width="40" height="40" rx="10"/>
    </g>
    <g fill="#C8F0DC">
      <rect x="645" y="239" width="40" height="40" rx="10"/>
      <rect x="703" y="239" width="40" height="40" rx="10"/>
      <rect x="645" y="297" width="40" height="40" rx="10"/>
      <rect x="703" y="297" width="40" height="40" rx="10"/>
      <rect x="761" y="297" width="40" height="40" rx="10"/>
    </g>
    <g fill="#FFF0B8">
      <rect x="587" y="181" width="40" height="40" rx="10"/>
      <rect x="645" y="181" width="40" height="40" rx="10"/>
      <rect x="587" y="239" width="40" height="40" rx="10"/>
    </g>
    <rect x="695" y="347" width="56" height="56" rx="12" fill="url(#answer)" stroke="#18245D" stroke-width="3"/>
    <path d="M666 317L702 353M724 310V338" stroke="#18245D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M713 375L721 383L737 365" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M827 90C827 67 792 57 754 70" stroke="#8B64DD" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 9" marker-end="url(#arrow)"/>
</svg>
