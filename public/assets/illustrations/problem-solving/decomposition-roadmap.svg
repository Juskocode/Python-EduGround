    <path d="M100 218L112 230L132 208" stroke="#44C58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M220 280H269" stroke="#18245D" stroke-width="5" stroke-linecap="round"/>
  <path d="M269 280C294 280 288 139 318 139H350M269 280H350M269 280C294 280 288 421 318 421H350" stroke="#18245D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
