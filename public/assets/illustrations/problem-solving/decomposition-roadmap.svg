<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Problem decomposition roadmap</title>
  <desc id="desc">A large problem is divided into three smaller tasks, each follows a short sequence of steps, and the results reunite at a verified solution.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="38" x2="892" y2="522" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3EEFF"/>
      <stop offset=".48" stop-color="#EDF9F4"/>
      <stop offset="1" stop-color="#FFF4E8"/>
    </linearGradient>
    <linearGradient id="solution" x1="747" y1="200" x2="890" y2="364" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72DBA4"/>
      <stop offset="1" stop-color="#35B97C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#18245D" flood-opacity=".12"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#18245D" stroke-opacity=".045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#18245D"/>
    </marker>
  </defs>

  <rect x="14" y="14" width="932" height="532" rx="36" fill="url(#background)"/>
  <rect x="14" y="14" width="932" height="532" rx="36" fill="url(#grid)"/>
  <rect x="14" y="14" width="932" height="532" rx="36" stroke="#18245D" stroke-opacity=".12" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="56" y="187" width="164" height="186" rx="30" fill="#FFFFFF" stroke="#18245D" stroke-width="4"/>
    <path d="M94 240H182M94 268H159M94 296H174M94 324H143" stroke="#8D74DD" stroke-width="12" stroke-linecap="round"/>
