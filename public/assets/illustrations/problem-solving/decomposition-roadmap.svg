    <circle cx="837" cy="280" r="45" fill="#FFFFFF" fill-opacity=".92" stroke="#18245D" stroke-width="4"/>
    <path d="M814 280L830 296L861 260" stroke="#16835A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
