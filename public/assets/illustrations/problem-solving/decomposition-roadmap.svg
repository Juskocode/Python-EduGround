  <g filter="url(#shadow)">
    <rect x="356" y="82" width="222" height="114" rx="25" fill="#F7F3FF" stroke="#18245D" stroke-width="4"/>
    <circle cx="397" cy="139" r="20" fill="#A98AF2" stroke="#18245D" stroke-width="4"/>
    <path d="M436 123H538M436 145H511M436 167H492" stroke="#18245D" stroke-opacity=".54" stroke-width="9" stroke-linecap="round"/>

    <rect x="356" y="223" width="222" height="114" rx="25" fill="#EEF9F4" stroke="#18245D" stroke-width="4"/>
    <path d="M379 280L397 250L415 280L397 310L379 280Z" fill="#54CA91" stroke="#18245D" stroke-width="4"/>
    <path d="M436 264H538M436 286H511M436 308H492" stroke="#18245D" stroke-opacity=".54" stroke-width="9" stroke-linecap="round"/>

    <rect x="356" y="364" width="222" height="114" rx="25" fill="#FFF5EB" stroke="#18245D" stroke-width="4"/>
    <rect x="378" y="400" width="39" height="39" rx="10" fill="#FF8B71" stroke="#18245D" stroke-width="4"/>
    <path d="M436 405H538M436 427H511M436 449H492" stroke="#18245D" stroke-opacity=".54" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g stroke="#18245D" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M588 139H620"/>
    <path d="M588 280H620"/>
    <path d="M588 421H620"/>
  </g>
  <g>
    <circle cx="644" cy="139" r="15" fill="#A98AF2" stroke="#18245D" stroke-width="4"/>
    <circle cx="690" cy="139" r="15" fill="#D9CBFF" stroke="#18245D" stroke-width="4"/>
    <path d="M659 139H675" stroke="#18245D" stroke-width="4"/>

