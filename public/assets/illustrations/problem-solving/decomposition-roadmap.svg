  <path d="M705 139C751 139 728 236 765 251M705 280H752M705 421C751 421 728 324 765 309" stroke="#18245D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
